name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Build
        run: npm run build

      # The suite is TypeScript (test/**/*.test.ts): Node >= 22.18 strips types
      # natively and supports glob positional args. Node 20 still builds and
      # pack-checks in this lane; install the suite deps and run it on 22.
      - name: Test
        if: matrix.node-version != 20
        run: npm test

      - name: Pack check
        run: npm pack --dry-run
